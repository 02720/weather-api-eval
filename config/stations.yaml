  score_ref_window_days: 15             # 参照平滑窗的基础厚度（固定气候态；run_anchored 回放仍为起报前 W 天）
  score_ref_min_days: 5                 # 不足 5 天 → 参照不可用，不出分
  # —— skill-v5 参照模式（2026-11 优化：参照必须是 lead 无关的共同标尺）——
  # fixed_trailing = 固定日历气候态，窗口为目标日之前 2×smooth 天（生产实时榜；
  #                  因果封闭：只用目标日之前的信息）
  # fixed          = 固定日历气候态，对称窗 ±smooth 天（归档月报回放）
  # run_anchored   = 起报日前 15 天线性外推（2026-11 旧 v5，保留对照/回放）
  # target         = 目标日前 15 天（v3/v4 归档回放）
  score_ref_mode: fixed_trailing
  score_ref_smooth_days: 7
  # skill-v5 下已退役、只留给归档回放的参数：报告 meta 只披露清单，
  # 不把旧值冒充当期口径（单一事实源见 SCORING.md §6）。
  deprecated_in_skill_v5:
    - score_skill_k
    - score_index_gain
    - score_composite_gain
    - score_penalty_lambda_temp
    - score_penalty_lambda_precip
    - score_slopes
  # 信度加权（2026-11 复核 P0-2 / 优化 A2-A4）：z̃ = √ρ·z。
  # ρ 用 ICC(1)（剥掉 7 天块效应、组间组内同一模型集）；ρ < exit 的维在该
  # 天桶退出 R（只发布 S）。门按（轨道 × 天桶）判定，降水另用"|ETS|≤0.05
  # 占比 >60%"的桶级备用判据（与 rain_no_skill_buckets 同一判据）。
  score_reliability_weighting: true
  score_reliability_min: 0.20
  score_reliability_exit: 0.20
  # 桶内尺度的稳健化（P0-2）：中位数 ± k·1.4826·MAD 双侧 Winsorize 后再算
  # μ/σ，防止单家故障源绑架整列尺度；k<=0 关闭（旧口径逐位回放）。
  score_winsor_k: 3.5
  score_skill_k: 2.303                  # 仅 skill-v3/v4 回放使用；skill-v5 用冻结仿射
  # —— skill-v5 综合分参数（显式声明、冻结进配置）——
  score_composite_alpha: 0.5            # 温度:降水 = 1:1（显式业务价值，非隐含缺省）
  score_composite_sd_temp: 8.77         # R 的退化兜底温度尺度（优先用桶内样本 sd）
  score_composite_sd_precip: 3.73       # R 的退化兜底降水尺度（优先用桶内样本 sd）
  score_rank_scale: 10.0                # R_show = 50 + 10·R（R 为 α 加权 z 分）
  # 显式 lead 权重：1–3d 全权重、4–7d 0.7、8–14d 0.4、15–16d 0.2
  score_lead_weights: {"1-3": 1.0, "4-7": 0.7, "8-14": 0.4, "15-16": 0.2}
  # 下半段 s=−(1−exp(s_raw/τ))：保 s(0)=0/s(1)=1、尾部渐近 −1。
  # **τ=1.0 是 C¹ 光滑约束的解**（x=0 处左右导数须相等）；旧值 0.9 在锚点
  # 留了 1.111 倍的斜率跳变（2026-11 复核 P1-3）。
  score_skill_tau: 1.0
  # 降水频率校准阻尼（P0-1 / B2）：d(B)=exp(−γ·max(0,|lnB|−lnB_tol)²)，只压不抬。
  # 乘到整个判别/分档族（ets/ord/grade）；B_tol 收紧到 1.10，γ 按
  # "argmax_B ETS·d(B) ∈ [0.95,1.10]" 重标定；γ=0 等价关闭（归档回放/对照）。
  score_freq_damp_gamma: 1.2
  score_freq_damp_tol: 1.10
  score_v5_display_gain: 1.0            # 冻结仿射 g(x)=clip(50+γ(x−50),0,100)
  # —— skill-v4 雨量分母下限（锚点安全：零雨参照仍为 0）——
  score_amt_floor_hourly_mm: 0.05       # 小时轨 κ（1mm/h 评分阈的 5%，起点值）
  score_amt_floor_daily_mm: 0.5         # 日轨 κ（0.5mm/day，起点值）
  # —— skill-v4 校准扣分项的**下行预算**（不占正向权重）——
  # q∈[0,1]；温度 MBE/slope 最多扣 0.15×50=7.5 分，降水 BIAS 最多扣 5 分。
  score_penalty_lambda_temp: 0.15
  score_penalty_lambda_precip: 0.10
  temp_accuracy_limits: [1, 2]          # ±1°C、±2°C 准确率
  # cyeva「降水量误差准确率」容差（mm）：|预报−实况| ≤ limit 的样本占比，只披露不入分
  rain_error_accuracy_limits_mm: [0.1, 1.0, 2.0]
  rain_threshold_mm: 0.1                 # 有无降水阈值（国内业务：≥0.1mm 记有降水；明细诊断口径）
  rain_daily_threshold_mm: 1.0           # 日榜·降水维阈值：24h 累计 ≥1mm 记"有效降水日"
  rain_hourly_threshold_mm: 1.0          # 小时榜·降水维阈值：该小时 ≥1mm 记"在下雨"
                                         # （两个榜阈值的标定见 scripts/calibrate_*.py；
                                         #  0.1mm 口径在逐小时尺度上被毛毛雨偏差主导）
  hourly_lead_days: 16                   # 逐小时评估最大时效（天），lead 1..384h
  daily_max_offset_days: 16              # 按天评估最大日偏移（天），offset 1..16
  daily_min_hours: 20                    # 按天评估日覆盖门槛：逐小时聚合路径取"观测/
                                         # 预报共同有值的小时数"（两侧同集合，缺测对
                                         # 两侧同时消失），低于此值不入样；日产品补位
                                         # 路径沿用观测全天覆盖门槛（缺测不折算 0）
  daily_source_fallback: true            # 逐日预报补位：某日逐小时覆盖不足时，用快照
                                         # 自带的逐日预报块（daily_time/daily）继续做
                                         # 按天评估。逐小时覆盖充足时仍用逐小时聚合
                                         # （与历史存档同口径）；日产品只补按天轨道，
                                         # 绝不反推逐小时样本。false = 回到纯逐小时口径
  min_sample: 5                          # 样本数低于此值视为"样本不足"，不出结论
  # bootstrap 的单位是 7 天日历块（board_block_days），不再按误差自相关推块长。

  # —— 评分换算斜率（2026-10-18 重标定，季度重标定；标定窗口 = 冻结基线窗口
  # 2026-08-01 ~ 10-14，29 源；脚本 scripts/calibrate_score_slopes.py --from-json
  # .work/track_sources_baseline_window.json，留档 docs/score_slopes.md §九）——
  # **局部敏感度** = 名义权重 × 换算斜率 × 数据离散度，三者耦合；旧表只声明了
  # 前两个，名次实际由数据的偶然分布决定（2026-09 实测 mae 名义 10% 敏感度仅
  # 2.5%、bias 名义 10% 却有 27%）。此处 λ 按"子分桶内跨源 sd = 8 分"反解，
  # 于是局部敏感度 = 8w，与名义权重成正比。
  # ⚠️ **局部敏感度 ≠ 方差份额**：综合分是子分的加权平均，某项对总方差的贡献
  # ∝ w_k²·σ_k²（不是 w_k·σ_k），所以 σ 统一标到 8 只会让份额 ∝ w_k²——
  # 大权重项系统性超配、小权重项欠配。2026-10-18 实测（小时轨，含协方差）：
  # ets 0.87×、far 0.81×、pod 0.57×、acc1 0.53×、acc2 0.52×、mae 0.51×、
  # rmse 0.44×、mbe 0.50×、amt_mae 0.48×、grade_ets 0.29×、r 0.14×、slope 0.11×。
  # **为什么没有按 σ_k ∝ 1/√w_k 强行让方差份额=名义权重（2026-10-31 复核）**：
  # 在 0~100 截断量表上该目标不可行——低权重项（r 7.5%）需要 λ≈100~150，
  # 子分饱和率从 1% 跳到 30%~77%；高权重项降 sd 会让 ets/amt_mae 大量贴边。
  # 那是拿区分度换公式好看。两种口径由报告页
  # meta.diagnostics.slope_influence 的 nominal_vs_effective 逐项披露即可。
  # **本轮重标定原因**：上轮冻结值（2026-10-06）在下滑窗口上
  # 实测 12/15 项桶内 sd 低于 8（最低 amt_mae 4.91），重标后池化 sd 回到 8.00；λ 变更视为评分
  # 口径变更，月报注明、前后名次不直接可比。
  # 2026-11 族权重重构（主指标+复核项）：族总权重与 λ 不变，族内份额变了——
  # 温度 误差45(RMSE35/MAE10)·阈值20(±2°C16/±1°C4)·偏差20(MBE15/站间5)·形态15(r10/slope5)
  # 降水 晴雨60(ETS50/POD5/FAR5)·雨量25·雨强15。
  # 依据：精确方差贡献审计（meta.diagnostics.exact_variance_contribution）显示
  # 同族高相关成员等权平分 = 同一证据计两遍；对拍名次位移中位 0.72 位。
  score_slopes:
    acc2: 0.650        # ±2°C 命中率每差 1.54 个百分点扣 1 分
    acc1: 0.630        # ±1°C 命中率每差 1.59 个百分点扣 1 分（命中轮廓族第二个点）
    rmse: 14.661       # 每差 0.068°C 扣 1 分，≥6.8°C 记 0 分
    mae: 19.260        # 每差 0.052°C 扣 1 分，≥5.2°C 记 0 分（误差幅度族 L1 侧）
    r: 69.400          # r×69.4（−1~1 线性入分）
    mbe: 14.697        # 每差 0.068°C 扣 1 分，≥6.8°C 记 0 分（正负对称）
    slope: 17.746      # 幅度每偏 2 倍（log₂ 刻度）扣 17.7 分，超/欠对称
    ets: 120.368       # ETS×120（0~1 线性入分）
    pod: 0.633         # 命中率每差 1.58 个百分点扣 1 分
    far: 0.749         # 空报率每高 1.34 个百分点扣 1 分
    # bias（旧 λ 18.709）随 2026-10-31 去冗余退出评分表：BIAS = POD/(1−FAR) 是
    # 列联表的确定性函数，且对称 log 口径存在"多一个空报反而加分"的单调性反例
    # （h=0 时 fa 1→2，FAR 恒 100%、POD/ETS 恒 0，但 BIAS 0.05→0.10 的靠近 1
    #  奖励让降水分 +1.68 分）。明细列照旧发布，不再占权重。
    amt_mae: 37.709    # 相对雨量误差（雨量MAE÷实况平均雨量）每高 0.027 扣 1 分
    # amt_bias（旧 λ 11.462）随 2026-10-25 去冗余退役：与 amt_mae 桶内相关
    # 0.995/1.000，已并入雨量精度族、不再入分；明细列照旧发布。
    grade_ets: 176.001 # 雨强分辨力（中雨/大雨档 ETS 加权均值）×λ，0~1 线性入分，负值记 0 分
    mbe_bdisp: 35.286  # 站间一致性：各站系统偏差的离散度每差 0.028°C 扣 1 分，
                       # ≥2.8°C 记 0 分（dev 族，正值越大越差）
  # —— 展示层"技能指数"缩放（2026-10-31；见 config.py 同名条目注释）——
  # **只作用于展示，不参与评分/名次/CI/显著性**。评分管道里维度分与综合分保持
  # 未缩放原始分；读者看到的 0~100 分数由 evaluate.display_* 在装配榜面/趋势图时
  # 施加一次仿射 g(s)=center+gain·(s−center)。13 个子分各自被标定到"桶内跨源
  # sd = 8"，但维度分是权重合计为 1 的加权平均 → sd 收缩到 ≈2.8，整榜被压进
  # ~10 分带。gain 由留白规则反解：取标定窗口全部维度分的 P99.5 映到软上限 98
  # （留 2 分可见边），gain=(98−50)/(P99.5−50)=1.744（P99.5=77.53）。截断只影响
  # 屏幕数字，不再可能改变名次（2026-10-31 复核 P0-3）。
  # **固定冻结、不按当期 μ/σ 自适应**；变更视为展示口径变更、须重冻基线
  # （tests/baseline/CHANGELOG.md）。
  score_index_gain: 1.744               # = (98−50)/(77.53−50)（新族权重窗口反解）
  score_index_center: 50.0              # 展示中心（0~100 量表的中点）
  # 综合分视图的**总**展示增益（2026-10-31 把原"维度 gain × 综合分 gain"两层合并）：
  # 综合分 P99.5=66.76 → 98，2.863 = (98−50)/(66.76−50)。只作用于
  # display_composite_score / display_ci，不改排名。
  score_composite_gain: 2.863
  # 小时轨 : 日轨 的宏观权重（1 : 0.5 = 2:1）。日轨的日极值/日累计对多数源是
  # 同一份逐小时预报重新分箱，独立性有限；降为 1/3 后两轨仍各保留自己的问题
  # （小时几点 vs 这一天），但不再把同一类信息计两遍。只影响跨轨合成。
  daily_track_weight: 0.5
  bootstrap_runs: 500                    # 按天分块 bootstrap 重采样次数（总榜 CI / 冠军频率）
  sensitivity_runs: 500                  # 权重敏感性：全部子分权重各扰动 ±40% 的次数
                                         # （项数跟随 TEMP/PRECIP_SCORE_PARTS 动态）
  min_board_neff: 30                     # 总榜入围门槛（逐小时温度维）：n_eff 低于此值列"样本积累中"
  min_board_neff_daily: 20               # 日榜温度维的入围门槛。日最高/最低的 n_eff 数的是
                                         # "独立自然日"，与逐小时的"独立小时误差"不是同一
                                         # 单位，必须单独设门槛（否则所有源都被一刀切）
  # —— 7 天日历分块（方案 A，2026-10-31）——
  # 单榜的核心：按周一锚定的 7 天块切分时间，块作为加法模型第二个列轴
  # （S(m, 块×天桶) = 技巧_m + 难度_(块,天桶) + 噪声），块效应吸收"这段天气
  # 整体更难/更易"的差异。新源只在自己的块里有格子，老源跨全部块；两者的行
  # 效应被拉到同一把"平均难度"的尺子上。只覆盖 1 个块的新源由经验贝叶斯收缩
  # 向面板均值靠拢（证据越少收缩越强），并给出更宽的 bootstrap 区间。
  board_block_days: 7                    # 块的日历长度（天）；周一锚定
  board_min_qualified_days: 7            # 入围所需的最少总验证日数
  board_block_min_days: 5                # 至少一个块里要有 5 天可评样本
  # —— 有效块的降水证据门槛（在单个块内考核，与 7 天新源同尺度）——
  # n_eff 数的是"雨/无雨判定"（干燥小时占绝对多数），不是降水事件证据。
  # 这两道门直接数独立事件（按 站×时刻 / 站×日 去重，同一事件不因多轮抓取重复计）：
  board_block_min_rain_events: 8         # 小时轨：块内观测 ≥1mm/h 的独立（站,小时）事件数
  board_block_min_rain_days: 3           # 日轨：块内观测日雨量 ≥1mm 的独立（站,日）雨日数
  board_block_min_cells: 3               # 每条轨道在一个有效块内至少 3 个综合分格子
  # 旧累计口径（保留为诊断层口径走廊的对照值，不再作为分块榜入围门槛）：
  min_board_rain_events: 8               # 旧值 30：累计窗口会把 7 天新源一刀切掉
  min_board_rain_days: 3                 # 旧值 8：同上
  min_board_cells: 3                     # 旧值 4：分块模型按"有效块内 3 格"考核

  # —— 降水分"最小存活权重"门槛（2026-10-18，score_review_proposal §2 P8 的修法）——
  # 降水维 5 项入分指标里 4 项事件指标（ets/pod/far/grade_ets）需要真实降水
  # 事件才存在，amt_mae 一项只要 Σ实况雨量>0 就能算。"整桶
  # 只有几场不达标的小雨"的格原本会只剩这一项、被重归一成全部话语权并产出
  # 满分降水分（实测把两个分时效榜的第 1/2 名制造了出来）。现在区分两种缺失：
  # "指标对该源不存在"（照旧重归一）vs"该桶没有可评降水事件"（证据缺失）——
  # 换算后仍有效的子分权重之和低于名义总权重 × 该比例时，降水分判缺测（None）。
  # 0.5 = 少于半数名义权重可评即弃（缺省，与温度维 _mean2 的"半截证据不能当
  # 整个用"同一原理）；0 = 关闭（旧口径，留作对照/回归）。
  precip_min_surviving_weight: 0.5
  # —— 总榜的双向加法拟合（对抗式审查 P0-1/P1-4 的修正）——
  board_cell_weighting: neff             # 格子权重口径：neff = √(两维有效样本量的较小者)
                                         # （默认，让信息多的格子说话）；equal = 等权旧口径
  min_cell_neff: 15                      # 单个（源, 天桶）格子的最低有效样本量：低于门槛
                                         # 的格子不进劈分设计（旧实现靠 min_sample=5 放行）
  board_min_col_frac: 0.5                # 长尾桶相对门槛：家数不足"最大桶家数 × 该比例"
                                         # 的天桶不进主设计，单独出参考榜（0 = 关闭）
  board_ridge: 0.0                       # 列效应的收缩强度 λ（0 = 不收缩）
  board_long_tail_board: true            # 是否为被剔除的长尾桶单独出参考榜
  require_complete_snapshots: true       # 排除快照契约标了 complete=false 的残缺快照
                                         # （历史存档无该字段，按完整处理）
  source_stale_hours: 30                 # 源健康度阈值：超过该时长未成功抓取即告警
  # —— 观测多源编排（2026-09：解除 eia-data 单点依赖）——
  obs_stale_hours: 3.0                   # 观测源"停摆"阈值（小时）：某源最新观测滞后超过
                                         # 该值即判为不可直接采用（记录仍参与合并），由下一
                                         # 优先级的源补位
  obs_min_hours: 6                       # 单个观测源一轮至少要有多少小时才算"窗口未截断"；
                                         # 低于该值即降级（明显截断的页面不能当完整窗口用）
  # —— 数据体积治理（2026-09：让仓库能持续自动化运行）——
  compact_grace_days: 2                  # 月度冻结宽限期（天）：自然月结束满该天数后，该月的
                                         # 逐份快照才合并为月度 bundle（冻结后永不重写）
  compact_retain_months: 13              # 月度 bundle 的保留月数：更早的 bundle 出仓，其结论
                                         # 已由冻结的月度报告与该月指标摘要固化
  # —— 实时总榜的对账窗口（2026-10：总榜跨月累计）——
  # 缺省（不配置此项）= 自动：总榜窗口从最早可用数据月累计到当前，每月 1 号
  # 不清零；数据保留期（compact_retain_months）是窗口的天然上界，更早的月份
  # 出仓后自然滑出窗口（总榜表现为"保留期内的滚动累计"）。需要把起点钉死时
  # 才取消注释（"YYYY-MM" 或 "YYYY-MM-DD"，如强制只看 2026-09 以后做对照）：
  # live_window_start: "2026-09"
