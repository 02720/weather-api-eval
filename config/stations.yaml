eval:
  # —— skill-v3（2026-11）技能分口径 ——
  # 50 = 与过去-only 气候参照一样（无技巧）；100 = 完美；下半段指数压缩，
  # 不硬触底。旧月报按 meta.score_scheme=slope-v2 回放，不受影响。
  # skill-v5（2026-11）：综合分拆成两套语义，禁止一个数兼任两义
  #   · 名次分 R：桶内标准化（μ/σ 扣掉该档难度与两维离散度差），喂给总榜/分时效榜
  #   · 技能分 S：α·T+(1−α)·P 的绝对尺度，喂给 §02 走势图，不做桶内标准化
  # 50/100 在 S 上仍是"打平同类朴素参照 / 完美"；R 的 50 是"本档同台平均"。
  # 2026-11 起 dvs-v6（增量决策价值分）口径整体退役：生产口径回到 skill-v5
  # 单一口径；历史月报按各自 meta.score_scheme 回放，不受影响。
  # skill-v6（2026-11 综合分优化）：v5 的机制修正版，见 SCORING.md §11。
  # 与 v5 的四点差别：雨量技能换湿域对数比（D1）、频率阻尼只压正支（D2）、
  # acc2 退化锚点返回缺测（D5）、降水族内按 √nom/sd 归一（D3）。
  score_scheme: skill-v6
  # D4（skill-v6）：R 的按榜冻结尺度（hourly / daily 各一组逐列 μ/σ/φ）。
  # 由 scripts/freeze_rank_scale.py --write 录制；改了它必须重冻结基线。
