# 天气预报 API 准确度评估 —— 站点与评估配置
# 观测来源：主源 环境气象数据服务平台 eia-data.com（各站"气象站基本信息"页，近 24h 逐小时实况）；
#           备用源 中国气象数据网 data.cma.cn 站点实况接口（按 cma_id 的 WMO 站号寻址）。
#           编排规则见 src/weather_eval/obs/chain.py：主源可用时不惊动备用源。
# 预报来源：Open-Meteo（多模型一次请求）、彩云天气、和风天气、中科天机（均为独立抓取源，见 models 注释）

# 观测源优先级（高 → 低）。顺序即权威顺序：高优先级源已给出的小时，低优先级源
# 只补位、不覆盖（绝不做"谁后写谁赢"——那会让权威值取决于抓取顺序）。
# 新增源需同时登记在 src/weather_eval/obs/chain.py 的 OBS_SOURCE_PRIORITY 与
# __main__.py 的 _build_obs_sources。
obs_sources:
  - eia_data     # 主源：一次请求返回整页近 24h 逐小时（字段最全、请求量最小）
  - cma_data     # 备用源：中国气象数据网，按 WMO 站号逐整点抓取（需站点配 cma_id）

models:
  - ecmwf_ifs
  - ncep_gfs_global
  - dwd_icon_global
  # —— Open-Meteo 新增模型（2026-08）——
  - best_match                 # Open-Meteo 最优匹配（多模型择优合成）
  - cma_grapes_global          # 中国 CMA GRAPES 全球
  - cmc_gem_gdps               # 加拿大 GEM 全球
  - jma_gsm                    # 日本 JMA GSM
  - ukmo_global_deterministic_10km  # 英国 UKMO 全球 10km
  - ecmwf_ifs025               # ECMWF IFS 0.25°（新代号，与 ecmwf_ifs 并行归档）
  - ecmwf_aifs025_single       # ECMWF AIFS 0.25° 单次 AI 模式
  - ncep_aigfs025              # NCEP AI-GFS 0.25°（AI 模式）
  - ncep_hgefs025_ensemble_mean  # NCEP HGEFS 0.25° 集合均值
  # —— 独立预报源 ——
  - caiyun_v2_6          # 彩云天气 v2.6（fetch-forecast --source caiyun 抓取，Token 见环境变量 CAIYUN_TOKEN）
  - qweather_v1          # 和风天气 weather/v1（fetch-forecast --source qweather 抓取，Key 见环境变量 QWEATHER_API_KEY）
  # —— 中科天机（fetch-forecast --source tianji 抓取，网页接口，无需凭据）——
  - tj_km_fusion         # 公里级融合（nextgen）
  - tj_t2_early          # 天机2/DA（T2-Early，快速同化）
  - tj_t2                # 天机2/ND（T2）
  - tj_t1                # 天机1/ND（T1，AI 驱动）
  - tj_t1h_ai            # T1H-AI（T1-AI 高分辨率版）
  # —— 伏羲/风乌/中科星图（2026-08 新增独立源）——
  - fuxi_c88             # 伏羲中期 FuXi-C88（--source fuxi，fuxi-ai.cn 可视化接口抓取，无需凭据）
  - fuxi_det             # 伏羲确定性 FuXi-Det（--source fuxi_data，需环境变量 FUXI_DATA_TOKEN）
  - fengwu_ghr_9km       # 风乌 GHR-9km（--source fengwu，可选 FENGWU_API_KEY 延长预报时效）
  - geovis_v1            # 中科星图全国逐小时预报（--source geovis，需环境变量 GEVIS_TOKEN）
  # —— AccuWeather（2026-08 新增独立源；2026-08-29 起 Enterprise 入口）——
  - accuweather_v1       # AccuWeather 逐小时预报（--source accuweather，需环境变量 ACCUWEATHER_API_KEY；Enterprise 订阅 Key，最近城市吸附语义）
  # —— MSN 天气（2026-09 新增独立源）——
  - msn_v1               # MSN 天气（msn.cn/zh-cn/weather，--source msn，无需凭据；底层为中国天气网，最近城市吸附语义，时效上限约 9.3 天）
  # —— EW4ALL 云上早期预警支撑系统（2026-09 新增独立源；网页接口，无需凭据）——
  - cma_ndfs             # CMA-NDFS 中国气象局智能数字天气预报系统（--source ew4all；温度 10 天，降水 3 小时累计平铺）
  - fengqing_ai          # 风清AI模式（--source ew4all；温度 15 天逐 6 小时、降水 10 天，6 小时累计平铺）
  # —— 中国气象局公众气象服务网（2026-09 新增独立源；公开 JSON 接口，无需凭据）——
  - cma_public_v1        # weather.cma.cn/api/hourly，按 WMO 站号取站；3 小时分辨率、覆盖约 7 天
                         # （--source cma_public；降水为后向 3 小时累计，见 forecast/cma_public.py）

