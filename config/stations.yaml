eval:
  temp_accuracy_limits: [1, 2]          # ±1°C、±2°C 准确率
  rain_threshold_mm: 0.1                 # 有无降水阈值（国内业务：≥0.1mm 记有降水日）
  hourly_lead_days: 16                   # 逐小时评估最大时效（天），lead 1..384h
  daily_max_offset_days: 16              # 按天评估最大日偏移（天），offset 1..16
  daily_min_hours: 20                    # 按天评估日覆盖门槛：观测/预报任一侧当天非缺测
                                         # 小时数低于此值，该天该要素不入样（缺测不折算 0）
  daily_source_fallback: true            # 逐日预报补位：某日逐小时覆盖不足时，用快照
                                         # 自带的逐日预报块（daily_time/daily）继续做
                                         # 按天评估。逐小时覆盖充足时仍用逐小时聚合
                                         # （与历史存档同口径）；日产品只补按天轨道，
                                         # 绝不反推逐小时样本。false = 回到纯逐小时口径
  min_sample: 5                          # 样本数低于此值视为"样本不足"，不出结论
  # bootstrap 重采样块长（天）。0 = 自动：按日尺度温度误差的 lag-1 自相关推出
  # 去相关时间 τ=(1+ρ)/(1−ρ)，再受"块数 ≥ 6"约束收缩（块数太少时重采样组合退化，
  # 比块长偏短更糟）。块长 1 天只捕获日内相关，会把置信区间算窄约一倍。
  bootstrap_block_days: 0
  bootstrap_runs: 500                    # 按天分块 bootstrap 重采样次数（总榜 CI / 冠军频率）
  sensitivity_runs: 500                  # 权重敏感性：12 项权重各扰动 ±40% 的次数
  min_board_neff: 30                     # 总榜入围门槛：n_eff 低于此值列"样本积累中"
  # —— 总榜的双向加法拟合（对抗式审查 P0-1/P1-4 的修正）——
  board_cell_weighting: neff             # 格子权重口径：neff = √(两维有效样本量的较小者)
                                         # （默认，让信息多的格子说话）；equal = 等权旧口径
  min_cell_neff: 15                      # 单个（源, 天桶）格子的最低有效样本量：低于门槛
                                         # 的格子不进劈分设计（旧实现靠 min_sample=5 放行）
  board_min_col_frac: 0.5                # 长尾桶相对门槛：家数不足"最大桶家数 × 该比例"
                                         # 的天桶不进主设计，单独出参考榜（0 = 关闭）
  board_ridge: 0.0                       # 列效应的收缩强度 λ（0 = 不收缩）
  board_long_tail_board: true            # 是否为被剔除的长尾桶单独出参考榜
  require_complete_snapshots: true       # 排除快照契约标了 complete=false 的残缺快照
                                         # （历史存档无该字段，按完整处理）
  source_stale_hours: 30                 # 源健康度阈值：超过该时长未成功抓取即告警
  # —— 观测多源编排（2026-09：解除 eia-data 单点依赖）——
  obs_stale_hours: 3.0                   # 观测源"停摆"阈值（小时）：某源最新观测滞后超过
                                         # 该值即判为不可直接采用（记录仍参与合并），由下一
                                         # 优先级的源补位
  obs_min_hours: 6                       # 单个观测源一轮至少要有多少小时才算"窗口未截断"；
                                         # 低于该值即降级（明显截断的页面不能当完整窗口用）
  # —— 数据体积治理（2026-09：让仓库能持续自动化运行）——
  compact_grace_days: 2                  # 月度冻结宽限期（天）：自然月结束满该天数后，该月的
                                         # 逐份快照才合并为月度 bundle（冻结后永不重写）
  compact_retain_months: 13              # 月度 bundle 的保留月数：更早的 bundle 出仓，其结论
                                         # 已由冻结的月度报告与该月指标摘要固化
