name: 天气预报 API 准确度评测

on:
  schedule:
    # 北京时 06:00 / 13:00 / 20:00 = UTC 22:00(前一日) / 05:00 / 12:00
    - cron: "0 5,12,22 * * *"
  workflow_dispatch:
    inputs:
      month:
        description: "可选：指定月度汇总月份 YYYY-MM（留空则汇总上一自然月）"
        required: false
        default: ""

# 需要写回数据/报告并部署 Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 防止重叠运行互相覆盖（定时任务间隔 7h，足够错开）
concurrency:
  group: weather-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 配置 Python 3.12.6
        # 注：cyeva 0.2.3 + pint 0.24.4 在当前最新 3.12 补丁上有 dataclass 兼容问题，
        # 经验证 3.12.6 可正常导入；请勿随意升级到更高 3.12 补丁。
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.6"
          cache: pip

      - name: 安装依赖
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 抓取观测 + 预报快照 + 生成本次运行报告
        env:
          TZ: Asia/Shanghai
        run: python -m weather_eval all

      - name: 计算北京日与小时
        id: bj
        run: |
          echo "day=$(TZ=Asia/Shanghai date +%d)" >> "$GITHUB_OUTPUT"
          echo "hour=$(TZ=Asia/Shanghai date +%H)" >> "$GITHUB_OUTPUT"

      - name: 月度汇总（每月1号北京时 06:00 那次运行，或手动指定 month）
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'schedule' && steps.bj.outputs.day == '01' && steps.bj.outputs.hour == '06')
        env:
          TZ: Asia/Shanghai
        run: python -m weather_eval monthly ${{
          github.event.inputs.month != '' && format('--month {0}', github.event.inputs.month) || '' }}

      - name: 变基远端最新提交（避免 push 被拒）
        run: git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true

      - name: 提交数据与新报告
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自动评测数据更新"
          file_pattern: "data reports"
          commit_user_name: weather-eval-bot
          commit_user_email: bot@weather-eval.local
          commit_author: weather-eval-bot <bot@weather-eval.local>

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: 部署 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
