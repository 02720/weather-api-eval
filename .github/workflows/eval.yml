name: 天气预报 API 准确度评测

on:
  schedule:
    # 北京时 06:00 / 13:00 / 20:00 = UTC 22:00(前一日) / 05:00 / 12:00
    - cron: "0 5,12,22 * * *"
  workflow_dispatch:
    inputs:
      month:
        description: "可选：指定月度汇总月份 YYYY-MM（留空则汇总上一自然月）"
        required: false
        default: ""

# 需要写回数据/报告并部署 Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 防止重叠运行互相覆盖（定时任务间隔 7h，足够错开）
concurrency:
  group: weather-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    # 仓库采用 src 布局，且未做 pip 打包；运行 python -m weather_eval 需把 src 加入导入路径
    # （与 pyproject.toml 中 pytest 的 pythonpath=["src"] 保持一致）。
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 配置 Python 3.12.6
        # cyeva 0.2.3 在 Python 3.12 上可用；但其元数据错误地把 pint 钉死为 ==0.24.3，
        # 而 pint 0.24.3 在 3.12+ 上因 dataclass 问题无法导入。故用 --no-deps 单独安装
        # cyeva，再由 requirements.txt 提供兼容的 pint==0.24.4（见该文件顶部说明）。
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.6"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install --no-deps cyeva==0.2.3

      - name: 抓取观测 + 预报快照 + 生成本次运行报告
        env:
          TZ: Asia/Shanghai
        run: python -m weather_eval all

      - name: 计算北京日与小时
        id: bj
        run: |
          echo "day=$(TZ=Asia/Shanghai date +%d)" >> "$GITHUB_OUTPUT"
          echo "hour=$(TZ=Asia/Shanghai date +%H)" >> "$GITHUB_OUTPUT"

      - name: 月度汇总（每月1号北京时 06:00 那次运行，或手动指定 month）
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'schedule' && steps.bj.outputs.day == '01' && steps.bj.outputs.hour == '06')
        env:
          TZ: Asia/Shanghai
        run: python -m weather_eval monthly ${{
          github.event.inputs.month != '' && format('--month {0}', github.event.inputs.month) || '' }}

      - name: 变基远端最新提交（避免 push 被拒）
        run: git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true

      - name: 提交数据与新报告
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自动评测数据更新"
          file_pattern: "data reports"
          commit_user_name: weather-eval-bot
          commit_user_email: bot@weather-eval.local
          commit_author: weather-eval-bot <bot@weather-eval.local>

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: 部署 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
