name: ci

# 本文件是 ci.yml 与 report.yml 的合并（2026-11-01）：此前 push 到 main 会同时触发
# 两条流水线——ci 跑 fast/golden/py313、report 跑 verify/报告重建/部署——各自独立
# 配环境，同一份依赖每轮被安装 4 遍（fast + golden + py313 + report），纯属重复运行。
# 合并后：
#   * PR        → test 作业（一次安装覆盖快层 + 按条件触发的 golden）；
#   * push main → test 作业 + pages 作业（前者测代码，后者只重渲染既有数据并部署）。
# 每次事件的依赖安装从 4 次降到 2 次（pages 作业与 test 作业保持相互独立、
# 各自可独立失败，不共享环境；两边都开 pip 缓存，第二次安装只花数秒）。
#
# 报告为什么要"数据不动、只重求值"：报告是"视图 = render(数据, 代码)"的纯函数，
# 而 eval.yml 的触发器只有 schedule 与 workflow_dispatch——合并一个改评分口径的
# PR 后，Pages 上的榜单最多滞后 7 小时才反映新口径。pages 作业补的就是那条
# push 即重建的路径：用已有数据重建报告并部署，不碰任何预报源。
#
# 为什么不会循环：eval.yml 与本 workflow 的 bot 提交都走 GITHUB_TOKEN，
# GitHub 不会因这种 push 再触发 workflow——两条链路各自收敛，没有互踢。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限基线：测试作业只需读；写权限（提交重建报告 / 部署 Pages）只提升给
# pages 作业（job 级 permissions 覆盖 workflow 级），PR 路径全程拿不到写凭据。
permissions:
  contents: read

jobs:
  # ---- test：快层必跑；golden 按 push/标签/口径变更三种口径触发 ----
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50      # 快层 ≤20 + golden ≤30（golden 已并入本作业）
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # PR 口径变更检测要 diff base；provenance.code_sha 要真实 SHA

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          # cyeva 0.2.3 在 3.13 上会 KeyError（PEP 667），故硬钉 3.12
          python-version: "3.12"
          cache: pip

      - name: 安装依赖（含 cyeva 的 --no-deps 两步）
        # 必须显式 --pip：默认路径在镜像带 uv 时会走 `uv sync`，而它装进项目 .venv，
        # 后面几步用的却是 setup-python 的解释器——于是"装好了"与"python -m 能跑"
        # 成了两件事，lint 步骤会以 `No module named ruff` 收场（2026-10-04 实况）。
        # 显式选路 = CI 的行为不再取决于 runner 镜像里恰好有没有 uv。
        run: ./scripts/install.sh --pip

      - name: ruff
        run: python -m ruff check src scripts tests

      - name: 快层测试
        run: python -m pytest -m "not golden and not slow" -n auto -q

      - name: 评分/口径路径变更检测（决定 PR 上 golden 是否必跑）
        # 静默缺口（2026-10 补）：golden 对拍此前靠"作者记得打 golden 标签"触发，
        # 标签不打、对拍就不存在——改评分数学/口径的 PR 可以完全绕过本仓库最核心
        # 的不变量而 CI 全绿。这里按变更路径强制（不想跑只能显式 commit 消息标注，
        # 没有静默通道）。
        id: scorediff
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE"...HEAD \
              | grep -qE '(^|/)(src/weather_eval/(evaluate|stats|graded)\.py|config/stations\.yaml|tests/baseline/|scripts/calibrate_)'; then
            echo "评分/口径路径有变更"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "评分/口径路径无变更"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Golden Master 对拍 + 性能预算
        # 三种触发口径合一：push 到 main 全跑（口径不变量按天盯）；PR 打 golden
        # 标签跑（手动点名）；PR 改了评分/口径路径必跑（上一步检出）。并入本作业
        # 后，一次依赖安装同时覆盖快层与 golden，不再为 golden 单开 job 重装一遍。
        if: >-
          github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'golden') ||
          steps.scorediff.outputs.changed == 'true'
        run: python -m pytest -m "golden" -q

  # ---- pages：push 到 main / 手动触发时，用已有数据重建报告并部署 ----
  # 与 test 作业相互独立（互不 needs）：测试红不拦截数据视图的重渲染——
  # 报告反映的是已封存数据，eval.yml 的部署同样不等测试。
  # 与 eval.yml 同组串行（concurrency 组是仓库级的，跨 workflow 生效）：
  # 两条链路都全量覆写 reports/ 再提交，若并行会互相 rebase 出冲突。排队而非
  # 取消：push 触发的重建最多等一轮评测结束（最坏 2h），但绝不互相覆盖。
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write     # 提交重建后的报告与衍生数据
      pages: write
      id-token: write     # deploy-pages 的 OIDC
    # 仓库采用 src 布局，且未做 pip 打包；运行 python -m weather_eval 需把 src
    # 加入导入路径（与 eval.yml、pyproject 的 pytest pythonpath 保持一致）。
    # ⚠️ 此变量不可省：install.sh 的可编辑安装失败是被容忍的（不影响本用法），
    # 2026-11-01 run #42 就是合并时漏搬了这个 env，verify 以
    # "No module named weather_eval" 收场。
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    concurrency:
      group: weather-eval
      cancel-in-progress: false
    steps:
      - name: 检出
        # 浅检出即可：provenance.code_sha 优先取 GITHUB_SHA，不依赖完整历史
        # （provenance.py 的 CI 分支），与 eval.yml 的 eval 作业同款。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 配置 Python 3.12
        # 3.12 上限与下限都由 cyeva 0.2.3 决定（3.13 无法导入），见 install.sh 顶部
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        # 显式 --pip 选路（同 test 作业）：不依赖 runner 镜像里恰好有没有 uv
        run: ./scripts/install.sh --pip

      - name: 校验数据完整性（哈希链，可审计性 §7.1）
        # 顺序不能反：report 会随报告重写 data/manifest，verify 放在 report
        # **之前**才能保住"重算 Merkle 根 vs 存档清单"这道闸（report 之后跑
        # verify，根必然自洽，只剩内嵌哈希一道闸）。校验失败 = 原料可疑，
        # 绝不把建立在可疑数据上的视图发布出去。
        env:
          TZ: Asia/Shanghai
        run: python -m weather_eval verify

      - name: 用已有数据重建报告（不做任何抓取）
        # report = render(数据, 代码)：只读 data/ 快照与缓存，重建主报告
        # index.html 与健康度看板 health.html，并按当前代码刷新月度归档视图
        # （refresh_monthly_archives 比对视图指纹，平时零成本）。代码一变，
        # 页面立即跟上，不等下一次定时评测。
        env:
          TZ: Asia/Shanghai
        run: python -m weather_eval report

      - name: 提交重建后的数据与报告
        # report 会连带刷新 data/manifest（哈希链清单）、data/metrics/blocks
        # （缓存随口径失效重建）与 data/health，这些都是结论口径的一部分，
        # 与 eval.yml 同款一并入库，保持"克隆即最新视图"。无变化时该 action
        # 自动跳过（幂等），不产生空提交。
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403  # v5
        with:
          commit_message: "chore: 按最新代码重建报告（无抓取）"
          file_pattern: "data reports"
          commit_user_name: weather-eval-bot
          commit_user_email: bot@weather-eval.local
          commit_author: weather-eval-bot <bot@weather-eval.local>

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: reports

      - name: 部署 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

  # ---- 3.13 就绪度：只记录，不阻塞（§8.1 第 3 条）----
  # cyeva 0.2.3 把本项目钉在 3.12。将来上游更新或决策变化时，这份每周记录
  # 直接可用——它把"到时候再说"变成"一直有数据"。
  py313-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 尝试在 3.13 上安装并跑快层测试
        run: |
          python -m pip install -q --no-deps cyeva==0.2.3 || \
            echo "::warning::cyeva 在 3.13 上无法安装（其元数据 Requires-Python <3.13）"
          python -m pip install -q -r requirements.txt -r requirements-dev.txt || true
          python -m pytest -m "not golden and not slow" -q 2>&1 | tail -40 || true
